basic:
  network:
    - type: ws
      host: 0.0.0.0
      port: 2310
      path: satori
      token: miraita2310

  prefix: ["/"]
  ignore_self_message: true
  log:
    level: debug
    ignores:
      - aiosqlite.core
      - httpcore._trace
      - sentry_sdk.integrations.logging
    save: false
    rich_error: false
    short_level: true

plugins:
  $files: []

  $prelude:
    - ::auto_reload

  $prefix:
    - key: ""
      plugins:
        - miraita

  .record_message:
    record_send: true

  .scheduler: {}

  .localdata:
    app_name: miraita

  ::auto_reload:
    watch_dirs: [.]
    watch_config: true
    $disable: env.ENVIRONMENT == "prod"

  browser:
    browser_type: chromium
    channel: chromium
    headless: true

  database:
    type: sqlite
    name: .miraita/miraita.db
    driver: aiosqlite

  server:
    host: 0.0.0.0
    port: 2310
    path: satori
    token: miraita2310
    adapters:
      - $path: "@milky.main"
        endpoint: "http://localhost:3010"
        token: ${{ env.MILKY_TOKEN }}

      - $path: "@qq.websocket"
        app_id: ${{ env.QQ_ID }}
        secret: ${{ env.QQ_SECRET }}
        token: ${{ env.QQ_TOKEN }}
        intent:
          guild_messages: true
          at_messages: false
          c2c_group_at_messages: true

  miraita:
    .plugins.checkin:
      coin: [50, 100]
      exp: 100
      favor: [10, 20]

    .plugins.sentry:
      dsn: ${{ env.SENTRY_DSN }}
      environment: ${{ env.ENVIRONMENT }}   
      default_integrations: true
      auto_enabling_integrations: true
      enable_tracing: false
      enable_logs: true
      traces_sample_rate: 1.0
      profiles_sample_rate: 1.0

    .plugins.wakatime:
      client_id: ${{ env.WAKA_CLIENT_ID }}
      client_secret: ${{ env.WAKA_CLIENT_SECRET }}
      register_route: /register
      redirect_uri: ${{ env.WAKA_REDIRECT_URI }}
      background_source: Lolicon

    .plugins.at-command:
      execute: llm

    .plugins.repeater:
      on_repeat:
        - min_times: 3
          probability: 0.3

        - min_times: 4
          probability: 0.3
          reply: 打断复读！


    .providers.llm:
      api_key: ${{ env.OPENAI_API_KEY }}
      base_url: https://api.openai.com/v1
      models:
        - name: "gpt-5.5"
          alias: "gpt"

        - name: "deepseek/deepseek-v4-flash"
          api_key: ${{ env.DEEPSEEK_API_KEY }}
          base_url: https://api.deepseek.com

        - name: "deepseek/deepseek-v4-pro"
          api_key: ${{ env.DEEPSEEK_API_KEY }}
          base_url: https://api.deepseek.com
