basic:
  network:
    - type: ws
      host: 0.0.0.0
      port: 2310
      path: satori
      token: miraita2310

  prefix: ["/"]
  ignore_self_message: true
  log:
    level: debug
    ignores:
      - aiosqlite.core
      - httpcore._trace
      - sentry_sdk.integrations.logging
    save: false
    rich_error: false
    short_level: true

plugins:
  $files: []

  $prelude:
    - ::auto_reload

  $prefix:
    - key: ""
      plugins:
        - miraita

  .record_message:
    record_send: true

  .scheduler: {}

  .localdata:
    app_name: miraita

  ::auto_reload:
    watch_dirs: [.]
    watch_config: true
    $disable: env.ENVIRONMENT == "prod"

  browser:
    browser_type: chromium
    channel: chromium
    headless: true

  database:
    type: sqlite
    name: .miraita/miraita.db
    driver: aiosqlite

  permission: {}

  server:
    host: 0.0.0.0
    port: 2310
    path: satori
    token: miraita2310
    adapters:
      - $path: "@milky.main"
        endpoint: "http://localhost:3010"
        token: ${{ env.MILKY_TOKEN }}

      - $path: "@qq.websocket"
        app_id: ${{ env.QQ_APP_ID }}
        secret: ${{ env.QQ_SECRET }}
        intent:
          guild_messages: true
          at_messages: false
          c2c_group_at_messages: true

  miraita:
    .plugins.checkin:
      coin: [50, 100]
      exp: 100
      favor: [10, 20]

    .plugins.sentry:
      dsn: ${{ env.SENTRY_DSN }}
      environment: ${{ env.ENVIRONMENT }}
      default_integrations: true
      auto_enabling_integrations: true
      enable_tracing: false
      enable_logs: true
      traces_sample_rate: 1.0
      profiles_sample_rate: 1.0

    .plugins.wakatime:
      client_id: ${{ env.WAKA_CLIENT_ID }}
      client_secret: ${{ env.WAKA_CLIENT_SECRET }}
      register_route: /register
      redirect_uri: ${{ env.WAKA_REDIRECT_URI }}
      background_source: Lolicon

    .plugins.at-command:
      execute: llm
      allow_arguments: true

    .plugins.repeater:
      on_repeat:
        - min_times: 3
          probability: 0.3

        - min_times: 4
          probability: 0.3
          reply: 打断复读！


    .providers.llm:
      api_key: ${{ env.OPENAI_API_KEY }}
      base_url: https://api.openai.com/v1
      enable_direct_message: true
      tool_call_limit: 5

      system: |
        你是林汐（Miraita），一个准确、友善、直接的通用 AI 助手。

        # 平台格式

        根据辅助变量 `platform` 选择格式，且不要向用户说明格式选择过程：

        - 当 `platform` 为 `milky`、`llonebot` 或 `onebot` 时，只返回纯文本；不得使用
          Markdown 语法，也不得输出 `markdown` 消息标签。
        - 其它平台必须使用 Markdown，并将完整回答放在且仅放在一层 `markdown`
          消息标签内。所有正文必须位于标签内，标签外不得有任何字符，也不得嵌套同名标签。

        即使回答只有一行，也必须遵守对应平台的格式。

      models:
        - name: "gpt-5.6-sol"
          alias: "gpt"

        - name: "deepseek/deepseek-v4-flash"
          api_key: ${{ env.DEEPSEEK_API_KEY }}
          base_url: https://api.deepseek.com

        - name: "deepseek/deepseek-v4-pro"
          api_key: ${{ env.DEEPSEEK_API_KEY }}
          base_url: https://api.deepseek.com

      tools:
        ::file_processor: {}
        ::webpage_processor: {}
        ::agno.tools.calculator.CalculatorTools: {}
        ::agno.tools.exa.ExaTools:
          # https://docs.agno.com/tools/toolkits/search/exa
          api_key: ${{ env.EXA_API_KEY }}
          enable_search: true
          enable_get_contents: true
          enable_find_similar: true
          enable_answer: true
          enable_research: false
          text: true
          text_length_limit: 1000
