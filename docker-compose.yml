services:
  miraita:
    image: komoridev/miraita:latest
    container_name: miraita
    restart: always
    ports:
      - "2310:2310"
    volumes:
      - "./entari.yml:/app/entari.yml"
      - "./miraita:/app/.miraita"
    env_file:
      - ".env"
    networks:
      - bot-network

  llbot:
    image: linyuchen/llbot:8.0.13
    ports:
      - "3010:3010"  # Milky
      - "5600:5600"  # Satori
      - "3080:3080"  # WebUI
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - WEBUI_PORT=3080
    volumes:
      - ./llbot_config:/app/llbot/data:rw
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:'+(process.env.WEBUI_PORT||3080)).then(()=>process.exit(0),()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge
